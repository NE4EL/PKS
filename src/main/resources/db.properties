# Настройки подключения к PostgreSQL.
# У каждого участника значения могут отличаться — правьте под свою локальную БД.
db.url=jdbc:postgresql://localhost:5432/isp
db.user=postgres
db.password=postgres

# Автоматически применять schema.sql и seed-data.sql при запуске (true/false).
# Удобно для разработки: при первом старте создаст таблицы и наполнит данными.
db.initOnStartup=true
