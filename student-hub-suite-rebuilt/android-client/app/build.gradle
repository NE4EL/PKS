plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.mirea.studenthub.android'
    compileSdk 36

    defaultConfig {
        applicationId "ru.mirea.studenthub.android"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Release никогда не должен случайно уехать на локальный HTTP backend.
        buildConfigField "String", "API_BASE_URL", '"https://example.invalid/api/"'
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            def debugApi = project.findProperty('STUDENTHUB_DEBUG_API_URL') ?: 'http://10.0.2.2:8080/api/'
            buildConfigField "String", "API_BASE_URL", '"' + debugApi + '"'
        }

        release {
            minifyEnabled true
            shrinkResources true
            def releaseApi = project.findProperty('STUDENTHUB_API_URL') ?: 'https://example.invalid/api/'
            buildConfigField "String", "API_BASE_URL", '"' + releaseApi + '"'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources.excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
        ]
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
